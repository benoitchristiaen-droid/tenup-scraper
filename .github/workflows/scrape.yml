name: Scrape TenUp

on:
  schedule:
    - cron: "0 5 * * *"   # tous les jours vers 7h (heure de Paris, été)
  workflow_dispatch:

concurrency:
  group: scrape-tenup
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Snapshot tournament IDs before scrape
        run: |
          if [ -f data/tournaments.json ]; then
            jq -r '.tournaments[].id' data/tournaments.json | sort -u > /tmp/old_ids
          else
            : > /tmp/old_ids
          fi

      - name: Run scraper
        # Réglages : classement de Nils, simple messieurs, 13/14, 15/16 ans et Seniors,
        # tournois en journée exclus sauf week-end et vacances (zone C)
        run: >-
          python scraper.py
          --city "Saint-Cloud, 92210"
          --distance 20
          --days 61
          --classement "30/1"
          --natures "SM"
          --age-ids "140|160|200"

      - name: Count new tournaments
        id: diff
        run: |
          jq -r '.tournaments[].id' data/tournaments.json | sort -u > /tmp/new_ids
          comm -13 /tmp/old_ids /tmp/new_ids > /tmp/added_ids
          NEW_COUNT=$(wc -l < /tmp/added_ids | tr -d ' ')
          echo "new_count=$NEW_COUNT" >> "$GITHUB_OUTPUT"
          echo "Found $NEW_COUNT new tournament(s)."

      - name: Open issue when new tournaments are found
        if: steps.diff.outputs.new_count != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEW_COUNT: ${{ steps.diff.outputs.new_count }}
          PAGE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: |
          {
            echo "$NEW_COUNT nouveau(x) tournoi(s) depuis le dernier passage."
            echo ""
            jq -r --rawfile ids /tmp/added_ids '
              ($ids | split("\n") | map(select(length > 0))) as $new
              | .tournaments[]
              | select(.id as $i | $new | index($i))
              | "- \(.date_start) | [\(.name)](https://tenup.fft.fr/tournoi/\(.id)) | \(.location.club) | \(.distance) | \(.epreuves // "")"
            ' data/tournaments.json
            echo ""
            echo "Liste complète : $PAGE_URL"
          } > /tmp/issue_body.md
          gh issue create \
            --title "$NEW_COUNT nouveau(x) tournoi(s) Ten'Up" \
            --body-file /tmp/issue_body.md

      - name: Commit & push changes
        run: |
          if [ -z "$(git status --porcelain data/tournaments.json docs/index.md)" ]; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/tournaments.json docs/index.md
          git commit -m "chore(data): refresh tournaments @ $(TZ=Europe/Paris date +%Y-%m-%dT%H:%M:%S%z)"
          git push origin HEAD:main
